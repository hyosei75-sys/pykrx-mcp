# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render 대시보드에서 New > Blueprint 로 이 저장소를 연결하면
# 아래 설정이 그대로 적용됩니다.
#
# ⚠️ 무료 플랜은 15분 유휴 후 인스턴스를 재웁니다.
#    다음 요청에 30~60초가 걸리므로, 브리핑에서 호출할 때
#    타임아웃이 날 수 있습니다. 검증용으로 먼저 쓰고,
#    상시 가동이 필요하면 유료 전환하거나 다른 호스트로 옮기세요.

services:
  - type: web
    name: pykrx-mcp
    runtime: python
    plan: free
    region: singapore            # Render 무료 리전 중 한국에서 가장 가까움
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Render가 무작위 값을 생성합니다.
      # 대시보드 Environment 탭에서 값을 복사해 Claude 커넥터 헤더에 넣으세요.
      - key: MCP_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
      # DNS 리바인딩 보호를 쓰려면 배포 후 도메인을 여기에 넣으세요.
      # - key: ALLOWED_HOSTS
      #   value: pykrx-mcp.onrender.com
      # KRX 계정이 있으면 추가 (없어도 익명 요청으로 동작)
      # - key: KRX_ID
      #   sync: false
      # - key: KRX_PW
      #   sync: false
